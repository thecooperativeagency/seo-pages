<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Homepage Explore cards mock — BMW of Jackson</title>
  <link rel="stylesheet" href="https://thecooperativeagency.github.io/fonts/bmw.css" />
  <style>
    body { margin: 0; background: #f4f5f7; color: #141414; font-family: bmw, 'BMW Type Next', BMWTypeNext, Helvetica, Arial, sans-serif; }
    .mock-note {
      max-width: 1120px; margin: 0 auto; padding: 16px 20px 8px;
      font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: #6b7280;
    }
    .mock-nav {
      background: #fff; padding: 16px 28px; font-size: 13px; letter-spacing: .16em; text-transform: uppercase;
      border-bottom: 1px solid #e5e7eb;
    }
    .mock-hero {
      height: 180px; background: #1c69d4;
      display: flex; align-items: center; justify-content: center;
      color: rgba(255,255,255,.7); font-size: 12px; letter-spacing: .18em; text-transform: uppercase;
    }
    .mock-slot { background: #f4f5f7; padding: 28px 20px 64px; }
  </style>
</head>
<body>
  <p class="mock-note">Mock only — how the three cards sit on a light Motive homepage. Paste the fragment file into Motive, not this page.</p>
  <div class="mock-nav">BMW of Jackson</div>
  <div class="mock-hero">Homepage slider</div>
  <div class="mock-slot" id="slot"></div>
  <script>
    fetch("explore-home-cards.html").then(function (r) { return r.text(); }).then(function (t) {
      document.getElementById("slot").innerHTML = t;
    });
  </script>
</body>
</html>
