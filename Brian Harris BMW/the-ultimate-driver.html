<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Ultimate Driver | Brian Harris BMW</title>
  <link rel="stylesheet" href="https://thecooperativeagency.github.io/fonts/bmw.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,650;0,6..72,700;1,6..72,400&display=swap" rel="stylesheet" />
  <style>
    :root {
      --paper: #ffffff;
      --ink: #141414;
      --muted: #5c574e;
      --line: rgba(20,20,20,.14);
      --blue: #0A3A6B;
      --head: BMWTypeNext, Helvetica, Arial, sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: #ffffff; color: var(--ink); }
    body {
      font-family: Newsreader, Georgia, "Times New Roman", serif;
      -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; }
    img { display: block; width: 100%; }
    .sheet {
      max-width: 820px;
      margin: 0 auto;
      background: var(--paper);
      padding: 32px 32px 72px;
    }
    .hero {
      display: block;
      position: relative;
      text-decoration: none;
      color: #fff;
    }
    .hero img { aspect-ratio: 4 / 5; object-fit: cover; object-position: 50% 28%; }
    .lockup {
      position: absolute;
      left: 24px;
      bottom: 18px;
      z-index: 1;
    }
    .lockup h1 {
      font-family: var(--head);
      font-weight: 700;
      color: #fff;
      font-size: clamp(3rem, 12vw, 5.4rem);
      line-height: .86;
      letter-spacing: -.04em;
      margin: 0;
      text-shadow: 0 1px 16px rgba(0,0,0,.35);
    }
    .cover-line {
      font-family: var(--head);
      font-size: 11px;
      letter-spacing: .16em;
      text-transform: uppercase;
      color: var(--muted);
      margin: 12px 0 0;
    }
    .issues { margin-top: 48px; }
    .issues > .label {
      font-family: var(--head);
      font-size: 12px;
      letter-spacing: .22em;
      text-transform: uppercase;
      color: var(--blue);
      margin: 0 0 8px;
    }
    .issue-row {
      padding: 22px 0 26px;
      border-top: 1px solid var(--line);
    }
    .issue-row .num {
      font-family: var(--head);
      font-size: 11px;
      letter-spacing: .16em;
      text-transform: uppercase;
      color: var(--muted);
      margin: 0 0 6px;
    }
    .issue-row h2 {
      font-family: var(--head);
      font-size: clamp(1.6rem, 4vw, 2.1rem);
      line-height: 1.08;
      letter-spacing: -.02em;
      font-weight: 700;
      margin: 0 0 14px;
    }
    .issue-row .inside-kicker {
      font-family: var(--head);
      font-size: 12px;
      letter-spacing: .22em;
      text-transform: uppercase;
      color: var(--blue);
      margin: 0 0 8px;
    }
    .issue-row ul { margin: 0 0 16px; padding: 0; list-style: none; }
    .issue-row li {
      font-size: 15px;
      line-height: 1.4;
      padding: 8px 0;
      border-top: 1px solid var(--line);
    }
    .issue-row li:first-child { border-top: 0; padding-top: 0; }
    .cta {
      display: inline-block;
      font-family: var(--head);
      font-size: 12px;
      letter-spacing: .16em;
      text-transform: uppercase;
      color: var(--blue);
      text-decoration: none;
      border-bottom: 1px solid var(--blue);
      padding-bottom: 2px;
    }
    .end {
      margin-top: 56px;
      padding-top: 16px;
      border-top: 1px solid var(--line);
      font-size: 13px;
      color: var(--muted);
      line-height: 1.6;
    }
    .end a { color: var(--ink); }
    @media (max-width: 720px) {
      .sheet { padding: 18px 16px 56px; }
      .hero img { aspect-ratio: 3 / 4; }
      .lockup { left: 16px; right: 16px; bottom: 16px; }
    }
  </style>
</head>
<body>
  <article class="sheet">
    <a class="hero" href="bhbmw-news-issue-01-september-2026.html">
      <img src="https://thecooperativeagency.github.io/seo-pages/assets/bhbmw-news-issue-01/x5-cover.jpg" alt="BMW X5 on the lot at Brian Harris BMW" />
      <span class="lockup">
        <h1>The Ultimate<br />Driver</h1>
      </span>
    </a>
    <p class="cover-line">Issue 01 · September 2026</p>

    <section class="issues" aria-label="Issues">
      <p class="label">Issues</p>
      <article class="issue-row">
        <p class="num">Issue 01</p>
        <h2>September 2026</h2>
        <p class="inside-kicker">Inside</p>
        <ul>
          <li>The i3 Touring</li>
          <li>Tsunami, then Jason Carter</li>
          <li>Tudor Black Bay 58</li>
          <li>X5, X3, X7</li>
          <li>Oil, 10%, brakes</li>
        </ul>
        <a class="cta" href="bhbmw-news-issue-01-september-2026.html">Read the issue</a>
      </article>
    </section>

    <footer class="end">
      The Ultimate Driver<br />
      <a href="https://brianharrisbmw.com">Brian Harris BMW</a> · 12336 Airline Hwy
    </footer>
  </article>
</body>
</html>
